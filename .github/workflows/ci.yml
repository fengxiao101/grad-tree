name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The manifest is generated and committed. If regenerating it produces a
      # diff, someone added a program without running npm run programs:manifest.
      - name: Check program manifest is current
        run: |
          npm run programs:manifest
          git diff --exit-code src/data/programManifest.generated.ts

      - name: Lint
        run: npm run lint

      # Runs the manifest, typecheck, production build and bundle budget check.
      - name: Typecheck and build
        run: npm run build
